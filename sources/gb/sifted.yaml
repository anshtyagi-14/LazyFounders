# Sifted (GB). Starter entry: run `npm run sources:verify -- sifted`, review robots.txt
# and the publisher's terms, then approve in /admin/sources (or set trustStatus/active here).
key: sifted
name: Sifted
country: GB
defaultLanguage: en
trustStatus: PENDING
active: false
priority: 5
domains:
  primary: sifted.eu
  aliases: []
  assets: []
discovery:
  methods: [rss]
  sitemaps: []
  feeds: [https://sifted.eu/feed]
  crawlIntervalMinutes: 30
  maxArticlesPerScan: 40
  recencyWindowHours: 48
  includePatterns: []
  excludePatterns: []
fetch:
  rateLimitPerMinute: 12
  renderPolicy: never
  robotsRequired: true
adapter: null
translation:
  mode: if_different
  targetLanguage: null
publishing:
  mode: MANUAL
  minConfidence: 0.85
imagePolicy: link_with_credit
paywall: metered
notes: "European startup news. Pro articles are paywalled and skipped."
