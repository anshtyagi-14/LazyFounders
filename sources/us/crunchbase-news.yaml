# Crunchbase News (US). Feed verified 2026-09-23: HTTP 200, items present,
# robots.txt has no blanket disallow for the default user-agent.
key: crunchbase-news
name: Crunchbase News
country: US
defaultLanguage: en
trustStatus: APPROVED
active: true
priority: 5
domains:
  primary: crunchbase.com
  aliases: [news.crunchbase.com]
  assets: []
discovery:
  methods: [rss]
  sitemaps: []
  feeds:
    - https://news.crunchbase.com/feed/
  crawlIntervalMinutes: 60
  maxArticlesPerScan: 20
  recencyWindowHours: 72
  includePatterns: []
  excludePatterns: []
fetch:
  rateLimitPerMinute: 12
  renderPolicy: never
  robotsRequired: true
  contentSource: page
adapter: null
translation:
  mode: if_different
  targetLanguage: null
publishing:
  mode: AUTO
  minConfidence: 0.85
imagePolicy: link_with_credit
paywall: none
notes: "Funding rounds, venture capital and startup data."
