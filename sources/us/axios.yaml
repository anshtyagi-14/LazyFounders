# Axios (US). Feed verified 2026-09-23: HTTP 200, items present,
# robots.txt has no blanket disallow for the default user-agent.
key: axios
name: Axios
country: US
defaultLanguage: en
trustStatus: APPROVED
active: true
priority: 5
domains:
  primary: axios.com
  aliases: []
  assets: []
discovery:
  methods: [rss]
  sitemaps: []
  feeds:
    - https://api.axios.com/feed/
  crawlIntervalMinutes: 20
  maxArticlesPerScan: 30
  recencyWindowHours: 24
  includePatterns: []
  excludePatterns: []
fetch:
  rateLimitPerMinute: 12
  renderPolicy: never
  robotsRequired: true
  contentSource: page
adapter: null
translation:
  mode: if_different
  targetLanguage: null
publishing:
  mode: AUTO
  minConfidence: 0.85
imagePolicy: link_with_credit
paywall: none
notes: "Short-form business, tech and policy news."
