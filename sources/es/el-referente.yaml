# El Referente (ES). Starter entry: run `npm run sources:verify -- el-referente`, review robots.txt
# and the publisher's terms, then approve in /admin/sources (or set trustStatus/active here).
key: el-referente
name: El Referente
country: ES
defaultLanguage: es
trustStatus: PENDING
active: false
priority: 5
domains:
  primary: elreferente.es
  aliases: []
  assets: []
discovery:
  methods: [rss]
  sitemaps: []
  feeds: [https://elreferente.es/feed/]
  crawlIntervalMinutes: 30
  maxArticlesPerScan: 40
  recencyWindowHours: 48
  includePatterns: []
  excludePatterns: []
fetch:
  rateLimitPerMinute: 12
  renderPolicy: never
  robotsRequired: true
adapter: null
translation:
  mode: if_different
  targetLanguage: null
publishing:
  mode: MANUAL
  minConfidence: 0.85
imagePolicy: link_with_credit
paywall: none
notes: "Spanish startup ecosystem news (Spanish language)."
