# TechCabal (NG). Starter entry: run `npm run sources:verify -- techcabal`, review robots.txt
# and the publisher's terms, then approve in /admin/sources (or set trustStatus/active here).
key: techcabal
name: TechCabal
country: NG
defaultLanguage: en
trustStatus: APPROVED
active: true
priority: 5
domains:
  primary: techcabal.com
  aliases: []
  assets: []
discovery:
  methods: [rss]
  sitemaps: []
  feeds: [https://techcabal.com/feed/]
  crawlIntervalMinutes: 30
  maxArticlesPerScan: 40
  recencyWindowHours: 48
  includePatterns: []
  excludePatterns: []
fetch:
  rateLimitPerMinute: 12
  renderPolicy: never
  robotsRequired: true
adapter: null
translation:
  mode: if_different
  targetLanguage: null
publishing:
  mode: AUTO
  minConfidence: 0.85
imagePolicy: link_with_credit
paywall: none
notes: "African technology and startup news."
