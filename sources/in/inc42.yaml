# Inc42 (IN). Starter entry: run `npm run sources:verify -- inc42`, review robots.txt
# and the publisher's terms, then approve in /admin/sources (or set trustStatus/active here).
key: inc42
name: Inc42
country: IN
defaultLanguage: en
trustStatus: APPROVED
active: true
priority: 5
domains:
  primary: inc42.com
  aliases: []
  assets: []
discovery:
  methods: [rss]
  sitemaps: []
  feeds: [https://inc42.com/feed/]
  crawlIntervalMinutes: 30
  maxArticlesPerScan: 40
  recencyWindowHours: 48
  includePatterns: []
  excludePatterns: []
fetch:
  rateLimitPerMinute: 12
  renderPolicy: never
  robotsRequired: true
adapter: null
translation:
  mode: if_different
  targetLanguage: null
publishing:
  mode: AUTO
  minConfidence: 0.85
imagePolicy: link_with_credit
paywall: metered
notes: "Indian startup, funding and tech policy news. Some Inc42 Plus articles are paywalled and are skipped."
