# THE BRIDGE (JP). Starter entry: run `npm run sources:verify -- thebridge`, review robots.txt
# and the publisher's terms, then approve in /admin/sources (or set trustStatus/active here).
key: thebridge
name: THE BRIDGE
country: JP
defaultLanguage: ja
trustStatus: APPROVED
active: true
priority: 5
domains:
  primary: thebridge.jp
  aliases: []
  assets: []
discovery:
  methods: [rss]
  sitemaps: []
  feeds: [https://thebridge.jp/feed]
  crawlIntervalMinutes: 30
  maxArticlesPerScan: 40
  recencyWindowHours: 48
  includePatterns: []
  excludePatterns: []
fetch:
  rateLimitPerMinute: 12
  renderPolicy: never
  robotsRequired: true
adapter: thebridge
translation:
  mode: if_different
  targetLanguage: null
publishing:
  mode: AUTO
  minConfidence: 0.85
imagePolicy: link_with_credit
paywall: none
notes: "Japanese startup and funding news (Japanese language)."
