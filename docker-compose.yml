services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lazyfounders
      POSTGRES_PASSWORD: lazyfounders
      POSTGRES_DB: lazyfounders
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - lazyfounders-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - lazyfounders-network
    restart: unless-stopped

networks:
  lazyfounders-network:
    driver: bridge

volumes:
  pgdata:
  redisdata:
