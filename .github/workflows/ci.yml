name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lf_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lf_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lf_test
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - name: Build packages and services
        run: |
          npx tsc -b packages/database packages/llm packages/ingestion-core
          for s in discovery-service scraper-service categorization-service intelligence-service publishing-service; do (cd apps/$s && npx tsc -b); done
      # Must follow the build: the CLI imports @lazyfounders/database, whose
      # package main is ./dist/index.js and does not exist until tsc has run.
      - name: Validate source registry
        run: npm run sources:validate
      - name: Unit tests
        run: npm test
      - name: Migrations
        run: npm run db:migrate
      - name: Integration tests (PostgreSQL + Redis)
        run: npm run test:int
      - name: Dashboard type check
        run: cd apps/api-dashboard && npx tsc --noEmit
